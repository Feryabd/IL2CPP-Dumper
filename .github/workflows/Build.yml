name: Build Android IL2CPP Dumper (CMake Ninja)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # Penting jika KittyMemory atau Keystone menggunakan submodule git

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c

      - name: Install Ninja Build
        run: sudo apt-get install ninja-build -y

      - name: Configure and Build with CMake (ARM64)
        run: |
          mkdir -p build/arm64-v8a
          cd build/arm64-v8a
          cmake -G "Ninja" ../.. \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          
          cmake --build .

      - name: Upload Compiled So Library
        uses: actions/upload-artifact@v4
        with:
          name: il2cpp_dumper_arm64_so
          path: build/arm64-v8a/libil2cpp_dumper.so
          
