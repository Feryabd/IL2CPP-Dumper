name: Build Android IL2CPP Dumper

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Memungkinkan Anda memicu build secara manual via tombol di GitHub

jobs:
  build-dumper:
    runs-on: ubuntu-latest

    steps:
    # 1. Mengunduh source code dari repositori GitHub Anda
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        submodules: recursive # Memastikan submodul seperti KittyMemory ikut terunduh

    # 2. Memasang Java (Dibutuhkan untuk sistem pendukung Android SDK/NDK)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3. Memasang Android NDK (Menggunakan action nttld resmi yang aktif)
    - name: Setup Android NDK
      id: setup-ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c # Versi stabil yang sangat direkomendasikan untuk proyek C++ Android modern

    # 4. Melakukan kompilasi menggunakan CMake bawaan NDK
    - name: Compile Shared Libraries (C++)
      run: |
        mkdir -p build/libs
        
        # Array arsitektur target yang akan dibangun
        ARCHS=("arm64-v8a" "armeabi-v7a" "x86_64")
        
        for ARCH in "${ARCHS[@]}"; do
          echo "========================================="
          echo " Membangun Binari Untuk Arsitektur: $ARCH"
          echo "========================================="
          
          # Membuat folder build sementara per arsitektur
          mkdir -p build_$ARCH
          cd build_$ARCH
          
          # Konfigurasi CMake menggunakan toolchain Android NDK yang diarahkan dari nttld
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=$ARCH \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release
            
          # Eksekusi kompilasi kode
          make -j$(nproc)
          
          # Membuat folder output dan memindahkan berkas .so hasil compile
          mkdir -p ../build/libs/$ARCH
          
          # Salin file .so hasil kompilasi
          if [ -f "libil2cpp_dumper.so" ]; then
            cp libil2cpp_dumper.so ../build/libs/$ARCH/
          else
            # Fallback jika nama output biner di CMakeLists.txt menggunakan penamaan lain
            cp *.so ../build/libs/$ARCH/ 2>/dev/null || true
          fi
          
          cd ..
        done

    # 5. Mengemas dan mengunggah hasil build biner agar bisa diunduh (.ZIP)
    - name: Upload Compiled Binary Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: il2cpp-dumper-android-libs
        path: build/libs/
        retention-days: 7 # File akan tersimpan di GitHub selama 7 hari
