name: Build Android IL2CPP Dumper

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-dumper:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android NDK
      id: setup-ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c

    - name: Compile Shared Libraries (C++)
      run: |
        mkdir -p build/libs
        
        ARCHS=("arm64-v8a" "armeabi-v7a" "x86_64")
        
        for ARCH in "${ARCHS[@]}"; do
          echo "========================================="
          echo " Membangun Binari Untuk Arsitektur: $ARCH"
          echo "========================================="
          
          mkdir -p build_$ARCH
          cd build_$ARCH
          
          # PERBAIKAN: Menambahkan CMAKE_CXX_STANDARD=17 agar fitur C++17 aktif
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=$ARCH \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON
            
          make -j$(nproc)
          
          mkdir -p ../build/libs/$ARCH
          
          if [ -f "libil2cpp_dumper.so" ]; then
            cp libil2cpp_dumper.so ../build/libs/$ARCH/
          else
            cp *.so ../build/libs/$ARCH/ 2>/dev/null || true
          fi
          
          cd ..
        done

    - name: Upload Compiled Binary Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: il2cpp-dumper-android-libs
        path: build/libs/
        retention-days: 7
